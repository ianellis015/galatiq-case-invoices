# Approval rules.
#
# Editable without touching code. Each rule names a condition from the fixed menu in
# predicates.py, supplies its parameters, and says what happens when it fires.
#
# effect:
#   reject  - do not pay, log the reason
#   hold    - a human decides
#   warn    - no change to the outcome; contributes to the risk score and the record
#
# When several rules fire, the most conservative effect wins: reject beats hold beats
# warn. `label` is what a reviewer sees at the top of the invoice, so it should read as a
# sentence to a person rather than as a rule name.
#
# risk is coarse on purpose -- 0/10/30/60/100. It is a signal for a human triaging a
# queue, not a calibrated probability, and pretending otherwise would be worse than
# useless on something that moves money.

rules:
  - id: R1
    description: Invoices at or above the VP threshold need a human signature.
    label: Over $10,000 — VP approval required
    predicate: total_usd_at_least
    params:
      amount: "10000.00"
    effect: hold
    risk: 30

  - id: R2
    description: >
      Any critical validation failure blocks payment. The checks already decided what
      counts as disqualifying; this rule only says what to do about it.
    label: Critical validation failure
    predicate: any_finding_with_severity
    params:
      severity: CRITICAL
    effect: reject
    risk: 100

  - id: R3
    description: >
      A revision of an invoice that has already been paid. Superseding a completed
      payment is a decision with consequences and not one to make automatically.
    label: Revises an invoice that was already paid
    predicate: any_finding_code_in
    params:
      codes: [REVISION_SUPERSEDES]
    effect: hold
    risk: 60

  - id: R4
    description: >
      Pressure tactics in the document -- manufactured urgency, wire-transfer requests,
      threatened consequences. Individually these are things honest vendors write when
      chasing a late payment, so they escalate rather than reject.
    label: Potential fraud detected — review before paying
    predicate: any_finding_code_in
    params:
      codes: [FRAUD_SIGNAL]
    effect: hold
    risk: 60

  - id: R5
    description: >
      Text addressed to an automated reader rather than describing the invoice. Nobody
      writes "ignore previous instructions" on a real invoice.
    label: Document attempted to manipulate the approval system
    predicate: any_finding_code_in
    params:
      codes: [PROMPT_INJECTION]
    effect: reject
    risk: 100

  - id: R6
    description: >
      A total sitting just under the approval threshold. One invoice at $9,975 is
      unremarkable; a pattern of them is somebody splitting orders to avoid review.
    label: Just under the approval threshold — possible structuring
    predicate: total_usd_between
    params:
      low: "9500.00"
      high: "10000.00"
    effect: warn
    risk: 40

  - id: R7
    description: >
      Denominated in a foreign currency and converted before the threshold was applied.
      Recorded so the rate used is visible in the decision.
    label: Converted from a foreign currency
    predicate: currency_not_usd
    params: {}
    effect: warn
    risk: 10

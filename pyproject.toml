[project]
name = "galatiq"
version = "0.1.0"
description = "Multi-agent invoice processing pipeline"
requires-python = ">=3.14"

# Only what the persistence layer actually needs today. The rest of the stack
# (langgraph, pydantic, pdfplumber, typer/rich, the LLM client) gets added in the
# phase that first uses it, so the dependency list stays honest about what the
# code imports.
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.13",
    "pdfplumber>=0.11",
    "openai>=2.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: the importable package lives at src/galatiq, not at the repo root.
# This keeps the tests importing the *installed* package rather than accidentally
# picking up loose files from the working directory.
packages = ["src/galatiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Live tests hit the real xAI API: they cost money, need a key, and fail when the
# network is down. Deselected by default so `uv run pytest` stays free, offline and
# deterministic. Run them deliberately with `-m live`.
markers = ["live: hits the real xAI API (deselected by default)"]
addopts = "-m 'not live'"
